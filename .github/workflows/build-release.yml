name: Build and release Windows packages

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version without v, for example 0.7.0-preview.5'
        type: string
        required: true
        default: '0.7.0-preview.5'
      publish:
        description: 'Publish only when this run uses a v* tag; branches never publish'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if (-not $env:GITHUB_REF_NAME.StartsWith('v')) { throw 'Release tags must start with v.' }
            $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          } elseif (-not [string]::IsNullOrWhiteSpace($env:VERSION_INPUT)) {
            $releaseVersion = $env:VERSION_INPUT
          } else {
            $releaseVersion = '0.7.0-preview.5'
          }
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw 'Invalid version. Use a semantic version without the v prefix.'
          }
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Set up build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Install test runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-runtime.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Check Python syntax and run unit tests
        run: |
          python -m compileall -q src/python
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }

      - name: Check JavaScript syntax and portable script tests
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            throw 'The Windows build runner must provide Node.js for JavaScript checks.'
          }
          $scriptFiles = foreach ($folder in @('src/audio', 'src/frontend')) {
            if (Test-Path -LiteralPath $folder) {
              Get-ChildItem -LiteralPath $folder -Filter '*.js' -File -Recurse
            }
          }
          foreach ($scriptFile in $scriptFiles) {
            node --check $scriptFile.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($scriptFile.Name)" }
          }
          Get-ChildItem -LiteralPath tests -File | Where-Object {
            $_.Name -like 'test-*.js' -or $_.Name -like 'test-*.mjs'
          } | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript test failed: $($_.Name)" }
          }

      - name: Check native parametric EQ in isolated process
        run: |
          python tests/eq_native_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Native EQ test failed.' }

      - name: Build installer and portable package
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & .\scripts\build.ps1 -Version $env:BUILD_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed.' }
          if (-not (Test-Path -LiteralPath dist/SHA256SUMS.txt)) {
            throw 'Build did not create the final checksum manifest.'
          }

      - name: Check native automatic loading with synthetic client
        run: |
          python tests/native_autoload/test_loader.py .build/Zig/ziglang/zig.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native autoload test failed.' }

      - name: Check default interactive installer initialization
        run: |
          python tests/installer_startup_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Default installer startup regression failed.' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NcmWasapiExtension-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/NcmWasapiExtension-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/NcmWasapiExtension-${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/NcmWasapiExtension-${{ steps.version.outputs.version }}-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download packages from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NcmWasapiExtension-${{ needs.build.outputs.version }}-windows-x64
          path: dist

      - name: Verify checksums and publish tag release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const root = path.resolve('dist');
            const version = process.env.RELEASE_VERSION;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            if (tag !== `v${version}`) throw new Error('Tag and built version differ.');
            const notesPath = path.join('docs', 'releases', `${tag}.md`);
            const fallbackNotes = 'Windows x64 输出扩展。当前客户端兼容范围及签名状态请阅读本版本文档。\n\n' +
              '附安装包、便携包、源码包及 SHA256SUMS.txt。当前版本没有自动更新器。';
            const releaseBody = fs.existsSync(notesPath)
              ? fs.readFileSync(notesPath, 'utf8').replace(/^\uFEFF/, '') : fallbackNotes;
            const files = fs.readdirSync(root).filter(name => fs.statSync(path.join(root, name)).isFile());
            const required = ['SHA256SUMS.txt', `NcmWasapiExtension-${version}-windows-x64-setup.exe`,
              `NcmWasapiExtension-${version}-windows-x64-portable.zip`, `NcmWasapiExtension-${version}-source.zip`];
            if (required.some(name => !files.includes(name))) {
              throw new Error('Installer, portable package, source archive, or checksum manifest is missing.');
            }
            const manifest = fs.readFileSync(path.join(root, 'SHA256SUMS.txt'), 'utf8').replace(/^\uFEFF/, '');
            const hashes = new Map();
            for (const line of manifest.split(/\r?\n/).filter(line => line.trim())) {
              const match = line.match(/^([0-9a-fA-F]{64})\s+\*?(.+)$/);
              if (!match || path.basename(match[2]) !== match[2] || hashes.has(match[2])) {
                throw new Error('Invalid or duplicate checksum manifest entry.');
              }
              hashes.set(match[2], match[1].toLowerCase());
            }
            for (const file of files.filter(name => name !== 'SHA256SUMS.txt')) {
              const actual = crypto.createHash('sha256').update(fs.readFileSync(path.join(root, file))).digest('hex');
              if (hashes.get(file) !== actual) throw new Error(`Checksum mismatch or missing entry: ${file}`);
            }
            for (const file of hashes.keys()) {
              if (!files.includes(file)) throw new Error(`Checksummed artifact missing: ${file}`);
            }
            const {owner, repo} = context.repo;
            const prerelease = version.includes('-');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
              if (!release.draft) throw new Error('This release is already public. Publish a new version instead.');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag,
                target_commitish: context.sha, name: `NcmWasapiExtension ${tag}`, draft: true,
                prerelease, body: releaseBody})).data;
            }
            const existing = await github.paginate(github.rest.repos.listReleaseAssets,
              {owner, repo, release_id: release.id, per_page: 100});
            for (const file of files) {
              const previous = existing.find(asset => asset.name === file);
              if (previous) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: previous.id});
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id,
                name: file, data: fs.readFileSync(path.join(root, file)),
                headers: {'content-type': file.endsWith('.txt') ? 'text/plain' : 'application/octet-stream'}});
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id,
              body: releaseBody, draft: false, prerelease, make_latest: prerelease ? 'false' : 'true'});

